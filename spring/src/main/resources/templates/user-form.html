<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .btn-custom {
            width: 100px; /* Ajusta el ancho según sea necesario */
        }
    </style>
</head>
<body>
<div class="container">
    <h2>User Form</h2>
    <form th:action="@{/users/save}" th:object="${user}" method="post" style="max-width: 500px; margin: 0 auto;">
        <div class="form-group row mb-3">
            <label class="col-sm-4 col-form-label" for="email">Email:</label>
            <div class="col-sm-8">
                <input type="email" class="form-control" id="email" th:field="*{email}" required minlength="8" maxlength="45" />
            </div>
        </div>
        <div class="form-group row mb-3">
            <label class="col-sm-4 col-form-label" for="firstName">First Name:</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required minlength="2" maxlength="100" />
            </div>
        </div>
        <div class="form-group row mb-3">
            <label class="col-sm-4 col-form-label" for="lastName">Last Name:</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required minlength="2" maxlength="100" />
            </div>
        </div>
        <div class="form-group row mb-3">
            <label class="col-sm-4 col-form-label" for="password">Password:</label>
            <div class="col-sm-8">
                <input type="password" class="form-control" id="password" th:field="*{password}" required minlength="8" maxlength="45" />
            </div>
        </div>
        <div class="form-group row mb-3">
            <label class="col-sm-4 col-form-label" for="enabled">Enabled:</label>
            <div class="col-sm-8">
                <input type="checkbox" class="large-checkbox" th:field="*{enabled}" />
            </div>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-custom m-2">Save</button>
            <button type="button" class="btn btn-secondary btn-custom m-2" onclick="cancelForm()">Cancel</button>
        </div>
    </form>
</div>

<script type="text/javascript">
    function cancelForm(){
        window.location.href = "/users";
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
